  <body>
    <h1>bio.viz connection fixture</h1>
    <p>
      Loads the committed bundle and nothing else. The browser tests make connections on this page
      and watch what it requests. The R in these tests is a stand-in (fake-webr/webr.mjs): real R is
      exercised by the R check page.
    </p>
    <script src="../../../dist/bio.viz-0.3.0/bio.viz.js"></script>
    <script>
      // The stand-in's "R functions": canned trees in the shape webR's toJs() returns.
      window.__fakeWebR = {
        evaluations: 0,
        instances: [],
        functions: {
          rank_sum: function () {
            return {
              type: 'list',
              names: ['method', 'p_value', 'counts'],
              values: [
                { type: 'character', names: null, values: ['Wilcoxon rank-sum test'] },
                { type: 'double', names: null, values: [0.0312] },
                { type: 'integer', names: ['Placebo', 'Active'], values: [86, 84] }
              ]
            };
          }
        }
      };
    </script>
  </body>
