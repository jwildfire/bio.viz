name: CI

on:
  pull_request:
    # Explicit types so a draft marked ready for review is checked; the default
    # set (opened, synchronize, reopened) would leave that transition untested.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # The dev and main branch rulesets require this check by its display name;
    # renaming it leaves them waiting on a check that never reports.
    name: Build, format, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Check dist/ matches a fresh build
        run: npm run build:check-dist

      - name: Run unit tests
        run: npm test

      # Desktop R, at the version that made site/r-check/expected.json, so the
      # step after it re-derives the R check page's expected results instead of
      # trusting the committed file. The survival package comes with R.
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'

      - name: Expected results are what desktop R produces
        run: npm run fixtures:check -- --require-r

      - name: Build site (link validation)
        run: npm run site

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Includes the RCON-LIVE tests, which load webR and the survival package
      # from their public hosts and run real R. They fail if those hosts cannot
      # be reached; nothing skips or retries. The megabytes and seconds they
      # measure are printed in this step's log and uploaded with test-results/.
      - name: Run browser tests
        run: npm run test:e2e -- --project=chromium

      - name: Evidence freshness guard
        run: npm run evidence:check

      # Requirement text is extracted from the matrices in requirements/. Both
      # source and extract are in this checkout, so the guard fails the build on
      # any uncommitted drift.
      - name: Requirement-text sync guard
        run: npm run requirements:check

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
